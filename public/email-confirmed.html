<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Email Confirmation | ClipStudio</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#f7f6ff;background:radial-gradient(circle at 16% 12%,rgba(240,91,164,.17),transparent 32%),radial-gradient(circle at 84% 85%,rgba(78,137,250,.17),transparent 33%),#0d1425}
    .brand{display:flex;align-items:center;gap:11px;margin-bottom:28px;text-decoration:none;color:#fff;font-size:23px;font-weight:850;letter-spacing:-.75px}
    .brand img{width:41px;height:41px;border-radius:12px}
    .brand span span{background:linear-gradient(105deg,#ff8c91,#f462c4);color:transparent;background-clip:text;-webkit-background-clip:text}
    .card{width:min(100%,510px);padding:clamp(25px,6vw,48px);text-align:center;background:linear-gradient(155deg,rgba(32,45,73,.96),rgba(24,32,55,.97));border:1px solid rgba(182,191,235,.19);box-shadow:0 28px 80px rgba(0,0,0,.4);border-radius:25px}
    .symbol{width:79px;height:79px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);border-radius:23px;background:linear-gradient(130deg,#ffb14d,#f15bad);font-size:40px;box-shadow:0 14px 45px rgba(239,91,163,.22)}
    h1{margin:0 0 13px;font-size:clamp(27px,5vw,37px);line-height:1.14;letter-spacing:-1.1px}
    p{font-size:15.5px;line-height:1.8;color:#bfcce2;margin:0 auto 26px;max-width:390px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-width:225px;min-height:48px;padding:12px 22px;border-radius:13px;color:#171a2b;background:linear-gradient(100deg,#ffb044,#fa6ba8);font-weight:800;text-decoration:none;box-shadow:0 8px 25px rgba(251,107,168,.14)}
    .button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    .subnote{margin-top:20px;font-size:12px;color:#8494b4}
  </style>
  <script>
    // Supabase's implicit email confirmation flow redirects with a short-lived
    // session in the URL fragment. Do not import the auth SDK or store that
    // session here: this is a confirmation-only page, NOT a login callback.
    const fragment = new URLSearchParams(location.hash.slice(1));
    const query = new URLSearchParams(location.search);
    const error = fragment.get('error_description') || query.get('error_description') || fragment.get('error') || query.get('error');
    const confirmed = !!(fragment.get('access_token') || fragment.get('code') || query.get('code'));
    // Clear sensitive tokens / one-time codes from the address bar immediately.
    history.replaceState(null, '', location.pathname);
    document.addEventListener('DOMContentLoaded', () => {
      const icon = document.querySelector('#symbol');
      const title = document.querySelector('#result-title');
      const detail = document.querySelector('#result-detail');
      const button = document.querySelector('#result-button');
      if (error) {
        icon.textContent = '!';
        title.textContent = 'Confirmation link could not be verified';
        detail.textContent = String(error).replaceAll('+', ' ').slice(0, 240) + '. Please request a new confirmation email if needed.';
        button.href = '/signup';
        button.textContent = 'Back to sign up';
      } else if (!confirmed) {
        icon.textContent = '✉';
        title.textContent = 'Open the link from your email';
        detail.textContent = 'No confirmation result was found here. Open the confirmation link that ClipStudio emailed you.';
        button.href = '/login';
        button.textContent = 'Go to log in';
      }
    });
  </script>
</head>
<body>
  <a class="brand" href="/" aria-label="ClipStudio home">
    <img src="/favicon.png" alt=""><span>Clip<span>Studio</span></span>
  </a>
  <main class="card" role="status" aria-live="polite">
    <div id="symbol" class="symbol" aria-hidden="true">✓</div>
    <h1 id="result-title">Account confirmed successfully!</h1>
    <p id="result-detail">Your email address is now verified. Your account is ready. For security, you have not been signed in automatically. Please log in using your email and password.</p>
    <a id="result-button" class="button" href="/login">Log in to ClipStudio</a>
    <div class="subnote">Your ClipStudio account is ready to use ✂</div>
  </main>
</body>
</html>
